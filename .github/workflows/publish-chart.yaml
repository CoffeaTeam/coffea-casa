name: Publish Helm chart

# Packages charts/coffea-casa and publishes it to this repo's own gh-pages
# branch as a Helm chart repo (https://coffeateam.github.io/coffea-casa/),
# using chartpress (see charts/chartpress.yaml).
#
# Runs automatically after every master push, once autotag.yaml has tagged the
# commit (workflow_run: tags pushed by autotag with GITHUB_TOKEN do not trigger
# other workflows). Pushes that did not change charts/ since the last published
# chart are skipped. Also runs on a GitHub Release, or manually.
#
# Chart version: CalVer tag mapped to strict SemVer as YYYY.MMDD.N
#   2026.09.29   -> 2026.929.0
#   2026.09.29.2 -> 2026.929.2
# (Helm rejects 4-part versions; same-day tags must sort above the day's first.)
# appVersion carries the exact git tag.
#
# NOTE: GitHub Pages must serve the gh-pages branch (root). chartpress creates
# the branch on the first run, but a maintainer must enable Pages once.
on:
  workflow_run:
    workflows: ["Auto CalVer Tag on Master Push"]
    types: [completed]
  release:
    types: [published]
  workflow_dispatch:

concurrency:              # two quick pushes must not race on gh-pages
  group: publish-chart
  cancel-in-progress: false

jobs:
  publish-chart:
    name: Package and publish charts/coffea-casa
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.event.release.tag_name || github.sha }}
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install chartpress
        run: pip install "chartpress>=2.1,<3" pyyaml

      - name: Decide version, and whether there is anything to publish
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          TAG="$RELEASE_TAG"
          if [ -z "$TAG" ]; then
            TAG=$(git tag --points-at HEAD | grep -E '^[0-9]{4}\.[0-9]{2}\.[0-9]{2}(\.[0-9]+)?$' | sort -V | tail -1 || true)
          fi
          if [ -z "$TAG" ]; then
            echo "No CalVer tag on $(git rev-parse --short HEAD); nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          IFS=. read -r Y M D N <<< "$TAG"
          VERSION="$Y.$((10#$M$D)).${N:-0}"

          INDEX=""
          if git fetch -q origin gh-pages 2>/dev/null; then
            INDEX=$(git show origin/gh-pages:index.yaml 2>/dev/null || true)
          fi
          read -r LAST_APP HAVE_VERSION < <(printf '%s' "$INDEX" | VERSION="$VERSION" python3 -c '
          import os, sys, yaml
          entries = ((yaml.safe_load(sys.stdin) or {}).get("entries") or {}).get("coffea-casa") or []
          last = max(entries, key=lambda e: str(e.get("created", "")), default={}).get("appVersion", "-")
          have = any(str(e.get("version")) == os.environ["VERSION"] for e in entries)
          print(last or "-", "yes" if have else "no")')

          PUBLISH=true
          if [ "$HAVE_VERSION" = yes ]; then
            echo "Chart $VERSION is already published; skipping."; PUBLISH=false
          elif [ "$EVENT" = workflow_run ] && [ "$LAST_APP" != "-" ] \
               && git rev-parse -q --verify "refs/tags/$LAST_APP" >/dev/null \
               && git diff --quiet "$LAST_APP" HEAD -- charts/; then
            echo "charts/ unchanged since last published chart ($LAST_APP); skipping."; PUBLISH=false
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "git tag $TAG -> chart version $VERSION (publish=$PUBLISH)"

      - name: Configure git identity for the gh-pages commit
        if: steps.plan.outputs.publish == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch chart dependencies
        if: steps.plan.outputs.publish == 'true'
        working-directory: charts/coffea-casa
        run: helm dependency update

      - name: Publish chart
        if: steps.plan.outputs.publish == 'true'
        working-directory: charts
        env:
          TAG: ${{ steps.plan.outputs.tag }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          sed -i "s/^appVersion:.*/appVersion: \"$TAG\"/" coffea-casa/Chart.yaml
          chartpress --skip-build --publish-chart --tag "$VERSION"
          echo "Published coffea-casa $VERSION (appVersion $TAG)" >> "$GITHUB_STEP_SUMMARY"