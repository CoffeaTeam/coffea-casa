name: Test Helm chart

# Two tiers:
#   lint-and-template - fast, no cluster. Renders the chart with each
#     values-*.yaml independently (that's how they're actually deployed -
#     never merged together) and fails on any schema violation.
#   install            - spins up a kind cluster and does a real `helm
#     install` with the dev values.yaml, then drives a real user spawn
#     through the Hub REST API using the static `test` service token
#     already baked into values.yaml. This is the tier that catches
#     runtime-only breakage helm template/lint can't see (e.g. a
#     kubespawner_override key KubeSpawner renamed, or a ConfigMap glob
#     silently dropping every key because one matched file was binary).
on:
  push:
    paths:
      - 'charts/**'
      - '.github/workflows/chart-test.yaml'
    branches:
      - master
  pull_request:
    paths:
      - 'charts/**'
      - '.github/workflows/chart-test.yaml'
  workflow_dispatch:

jobs:
  lint-and-template:
    name: Lint & template (${{ matrix.values_file }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        values_file: [values.yaml, values-prod.yaml, values-cmsaf-prod.yaml]
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Fetch chart dependencies
        working-directory: charts/coffea-casa
        run: helm dependency update

      - name: helm lint
        working-directory: charts/coffea-casa
        run: helm lint . -f ${{ matrix.values_file }}

      - name: helm template
        working-directory: charts/coffea-casa
        run: helm template coffea-casa . -f ${{ matrix.values_file }} > /dev/null

  install:
    name: Install on kind and spawn a user server
    runs-on: ubuntu-latest
    needs: lint-and-template
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: cc-chart-test

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Fetch chart dependencies
        working-directory: charts/coffea-casa
        run: helm dependency update

      - name: helm install (dev values)
        working-directory: charts/coffea-casa
        run: |
          kubectl create namespace coffea-casa-ci
          helm upgrade --install coffea-casa . \
            -f values.yaml \
            --namespace coffea-casa-ci \
            --wait --timeout 10m

      - name: Dump cluster state on install failure
        if: failure()
        run: |
          kubectl get all -n coffea-casa-ci
          kubectl describe pod -n coffea-casa-ci -l component=hub || true
          kubectl logs -n coffea-casa-ci -l component=hub --tail=300 || true

      - name: Spawn a user server through the Hub API
        run: ./ci/chart-spawn-test.sh coffea-casa-ci

      - name: Dump cluster state on spawn failure
        if: failure()
        run: |
          kubectl get all -n coffea-casa-ci
          kubectl logs -n coffea-casa-ci -l component=hub --tail=300 || true
