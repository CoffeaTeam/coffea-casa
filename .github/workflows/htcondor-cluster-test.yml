name: HTCondor cluster test

# Real end-to-end test of CoffeaCasaCluster against a live HTCondor pool
# (a native minicondor install, Docker-universe enabled) and the actual
# cc-analysis-alma9 worker image - not mocks. Runs whenever a change could
# break the real submission path: the coffea_casa package itself, or
# either of the images HTCondor jobs actually run (scheduler/notebook and
# worker).
#
# HTCondor must run natively on the runner, not inside a container talking
# to the runner's dockerd over a mounted socket (see comments in
# ci/htcondor-pool-setup.sh for why: that Docker-outside-of-Docker setup
# breaks docker-universe's scratch-dir bind mount).
#
# tests/test_coffeacasa.py (run by pypi-ci.yml) covers class logic with
# mocked HTCondor and stays fast; this job is the slower, real-condor
# regression test for the two of them together.
on:
  pull_request:
    paths:
      - coffea_casa/**
      - docker/Dockerfile.cc-dask-alma9
      - docker/Dockerfile.cc-analysis-alma9
      - docker/prepare-env/**
      - ci/htcondor-pool-setup.sh
      - ci/htcondor_cluster_test.py
    branches:
      - master
  push:
    paths:
      - coffea_casa/**
      - docker/Dockerfile.cc-dask-alma9
      - docker/Dockerfile.cc-analysis-alma9
      - docker/prepare-env/**
      - ci/htcondor-pool-setup.sh
      - ci/htcondor_cluster_test.py
    branches:
      - master
  workflow_dispatch:

env:
  # Tracks docker-build-test-publish.yaml's canonical (noml) row. This job
  # only needs *a* worker image, not every flavour.
  BASE_IMAGE: coffeateam/coffea-almalinux9-noml:2026.9.0-py3.12
  WORKER_IMAGE: coffea-casa/cc-analysis-alma9:htcondor-ci

jobs:
  htcondor-cluster-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: latest
          driver-opts: network=host

      # Loaded into the runner's own docker daemon (runner is already
      # linux/amd64, no QEMU needed) - the same daemon the native HTCondor
      # pool below will use directly. Shares docker-build-test-publish.yaml's
      # GHA cache scope so this doesn't rebuild from scratch every run.
      - name: Build the worker image (cc-analysis-alma9)
        uses: docker/build-push-action@v6
        with:
          context: docker/
          file: docker/Dockerfile.cc-analysis-alma9
          load: true
          tags: ${{ env.WORKER_IMAGE }}
          cache-from: type=gha,scope=cc-analysis-alma9-noml
          cache-to: type=gha,mode=max,scope=cc-analysis-alma9-noml
          build-args: |
            BASE_IMAGE=${{ env.BASE_IMAGE }}
            FLAVOUR=noml
            PYVER=3.12
            COMBINE=0

      - name: Install and start the HTCondor pool (native, Docker-universe enabled)
        run: ./ci/htcondor-pool-setup.sh

      - name: Install coffea_casa and its deps
        run: |
          python3 -m pip install --quiet "dask[distributed]" dask_jobqueue

      - name: Run the real CoffeaCasaCluster + HTCondor test
        run: |
          # CoffeaCasaCluster falls back to socket.getfqdn() for
          # +DaskSchedulerAddress when POD_IP/HOST_IP aren't set - the
          # runner's own hostname isn't resolvable from inside the sibling
          # worker container Docker spins up for the job, only the docker0
          # bridge gateway is. Real k8s deployments always set POD_IP; give
          # this test the equivalent.
          HOST_IP=$(ip -4 -o addr show docker0 | awk '{print $4}' | cut -d/ -f1)
          echo "HOST_IP=$HOST_IP"
          PYTHONPATH="$PWD" HOME="$HOME" WORKER_IMAGE=${{ env.WORKER_IMAGE }} HOST_IP="$HOST_IP" \
            python3 -u ci/htcondor_cluster_test.py

      - name: Dump HTCondor logs on failure
        if: failure()
        run: |
          condor_q -allusers || true
          condor_history -limit 10 -af ClusterId ExitCode HoldReason || true
          sudo bash -c 'tail -n 200 /var/log/condor/StarterLog* /var/log/condor/StartLog /var/log/condor/SchedLog' || true
