# Values for the Flatiron "cmsaf-prod" deployment (coffea.casa).
#
# Synced from the coffea-casa-config Flux repo:
#   manifests/flatiron/cmsaf-prod/jhub-helm.yaml (HelmRelease "cmsaf-jhub", spec.values)
#
# That HelmRelease deploys the upstream `jupyterhub` chart directly; here the
# same values are nested under `jupyterhub:` since jupyterhub is a dependency
# of this umbrella chart (see Chart.yaml). The files referenced by subPath
# below (auth.py, secret_creation_hook.py, login.html, logo.png.bin,
# oauthenticator-*.py) live in files/hub-extra/ and are packaged into the
# hub-extra-config-d ConfigMap by templates/hub-extra-config-d.yaml — in Flux
# these instead come from a `hub-config-d` ConfigMap generated by kustomize
# (manifests/flatiron/cmsaf-prod/kustomization.yaml configMapGenerator).
#
# NOT reproduced here (provisioned by Flux/kustomize/SealedSecrets outside
# this chart, in the coffea-casa-config repo):
#   - the `jhub-cms-auth`, `triton-bucket` secrets/configmaps
#   - the HelmRelease's `valuesFrom: hub-helm-config` ConfigMap overlay
#   - condor-token, xcache-token, cmsaf-prod-sm, object-storage, dragonfly,
#     triton-ingress, and other sibling resources in that kustomization
#   - the `cmsaf-secrets` volume itself, which secret_creation_hook.py adds
#     to the spawner dynamically per-user at spawn time

rbac:
  enabled: true

xcache:
  enabled: false

htcondor:
  enabled: false

jupyterhub:
  hub:
    # NOTE: the live HelmRelease pins hub.image to jupyterhub/k8s-hub:1.2.0,
    # matching the jupyterhub chart version (0.11.1) it deploys. That image is
    # incompatible with this repo's bumped jupyterhub chart dependency (its
    # generated jupyterhub_config.py needs kubernetes_asyncio, which 1.2.0
    # lacks) - left unset here to use the new chart's default hub image.
    command: ["sh", "-c"]
    args:
      -    pip install
             --cache-dir /srv/jupyterhub/.cache/pip
             pyjwt
             pymacaroons
        && jupyterhub
             --config /usr/local/etc/jupyterhub/jupyterhub_config.py
             --upgrade-db
    annotations:
      prometheus.io/scrape: "true"
      prometheus.io/path: /hub/metrics
    extraEnv:
      OAUTH2_AUTHORIZE_URL: https://cms-auth.cern.ch/authorize
      OAUTH2_TOKEN_URL: https://cms-auth.cern.ch/token
      OAUTH_CLIENT_ID:
        valueFrom:
          secretKeyRef:
            name: jhub-cms-auth
            key: client_id
      OAUTH_CLIENT_SECRET:
        valueFrom:
          secretKeyRef:
            name: jhub-cms-auth
            key: client_secret
      DASK_BASE_DOMAIN: cmsaf-prod.flatiron.hollandhpc.org
      CONDOR_ENABLED: 'True'
      SERVICEX_ENABLED: 'False'
    extraVolumeMounts:
      - name: custom-templates
        mountPath: /etc/jupyterhub/custom
      - name: hub-extra-config-d
        mountPath: /usr/local/etc/jupyterhub/auth.py
        subPath: auth.py
      - name: hub-extra-config-d
        mountPath: /usr/local/etc/jupyterhub/jupyterhub_config.d/secret_creation_hook.py
        subPath: secret_creation_hook.py
      - name: hub-extra-config-d
        # Custom login page
        mountPath: /etc/jupyterhub/custom/login.html
        subPath: login.html
      - name: hub-extra-config-d
        # Custom login logo
        mountPath: /usr/local/share/jupyterhub/static/images/logo.png
        subPath: logo.png.bin
      - name: hub-extra-config-d
        # Override GenericOAuthenticator with token refresh version
        mountPath: /usr/local/lib/python3.8/dist-packages/oauthenticator/generic.py
        subPath: oauthenticator-generic.py
      - name: hub-extra-config-d
        # Pull in v14.2.0 of oauthenticator/oauth2.py, unmodified
        # Our patched oauthenticator/generic.py comes from v14.2. as well
        # Remove once hub is running v14+
        mountPath: /usr/local/lib/python3.8/dist-packages/oauthenticator/oauth2.py
        subPath: oauthenticator-oauth2-14.2.0.py
      - name: hub-extra-config-d
        # Add CoffeaOAuthenticator to save tokens to secret
        mountPath: /usr/local/lib/python3.8/dist-packages/oauthenticator/coffea.py
        subPath: oauthenticator-coffea.py
    extraVolumes:
      - name: custom-templates
        emptyDir: {}
      - name: hub-extra-config-d
        configMap:
          name: hub-extra-config-d
    extraConfig:
      templates: |
        c.JupyterHub.template_paths = ['/etc/jupyterhub/custom/']
        c.JupyterHub.authenticate_prometheus = False
      jupyter_server_config.py: |
        c.ServerProxy.servers = {
            "vscode": {
                "command": [
                    "code-server",
                    "--bind-addr=127.0.0.1:{port}",
                    "--auth=none",
                    "--disable-telemetry",
                    "."
                ],
                "timeout": 20,
                "launcher_entry": {
                    "title": "VS Code",
                    "icon_path": "/usr/local/share/jupyter/icons/vscode.svg",
                },
            }
        }
    config:
      Authenticator:
        # Persist OAuth tokens in jhub database
        enable_auth_state: true
      CryptKeeper: # FIXME: Add key directly for now
        keys:      #        Remove when we upgrade chart to 1.0+, and rotate to new key
          - 413ff34d2dc7956fd9789c66a73f9e4ad2b3685120056386abd168326e6445a9
      JupyterHub:
        authenticator_class: oauthenticator.coffea.CoffeaOAuthenticator
      GenericOAuthenticator:
        login_service: CMS SSO
        token_url: https://cms-auth.cern.ch/token
        userdata_method: GET
        userdata_params:
          state: state
        userdata_url: https://cms-auth.cern.ch/userinfo
        username_key: email
        scope:
          - openid
          - profile
          - email
          - offline_access
          - storage.read:/

  proxy:
    https:
      enabled: true
      hosts:
        - hub.cmsaf-prod.flatiron.hollandhpc.org
        - coffea.casa
      letsencrypt:
        contactEmail: cms-support@cse.unl.edu
    service:
      type: LoadBalancer
      nodePorts:
        http:
        https:
      annotations:
        external-dns.alpha.kubernetes.io/hostname: hub.cmsaf-prod.flatiron.hollandhpc.org, coffea.casa

  singleuser:
    cloudMetadata:
      blockWithIptables: false
    image:
      pullPolicy: IfNotPresent
    memory:
      limit: 8G
    extraEnv:
      # For now we use ServiceX only from within JH notebooks
      #SERVICEX_HOST: https://cmsaf-servicex.servicex.coffea.casa
      NAMESPACE: cmsaf-prod
      BASH_ENV: "/usr/local/etc/profile.d/conda.sh"
      EXTERNAL_HOSTNAME: coffea.casa
      XCACHE_HOST: xcache.cmsaf-dev.flatiron.hollandhpc.org
      SERVICEX_HOST: http://cmsaf-servicex-servicex-app:8000
      SERVICEX_TYPE: uproot
      AWS_ACCESS_KEY_ID:
        valueFrom:
          secretKeyRef:
            name: triton-bucket
            key: AWS_ACCESS_KEY_ID
      AWS_SECRET_ACCESS_KEY:
        valueFrom:
          secretKeyRef:
            name: triton-bucket
            key: AWS_SECRET_ACCESS_KEY
      TRITON_BUCKET_HOST:
        valueFrom:
          configMapKeyRef:
            name: triton-bucket
            key: BUCKET_HOST
      TRITON_BUCKET_NAME:
        valueFrom:
          configMapKeyRef:
            name: triton-bucket
            key: BUCKET_NAME
      TRITON_BUCKET_PORT:
        valueFrom:
          configMapKeyRef:
            name: triton-bucket
            key: BUCKET_PORT
    storage:
      extraVolumes:
        - name: cvmfs
          persistentVolumeClaim:
            claimName: cvmfs
            readOnly: true
        - name: cmsaf-secrets-chown
          emptyDir: {}
        #- name: cms-store-user
        #  persistentVolumeClaim:
        #    claimName: cms-store-user
      extraVolumeMounts:
        # FIXME: Updated secret_creation_hook will only add the volume,
        #        allowing mount point to be specified here
        #- mountPath: /etc/cmsaf-secrets
        #  name: cmsaf-secrets
        - mountPath: /etc/cmsaf-secrets
          name: cmsaf-secrets
        - mountPath: /etc/cmsaf-secrets-chown
          name: cmsaf-secrets-chown
        - mountPath: /cvmfs
          name: cvmfs
          mountPropagation: HostToContainer
          readOnly: true
        #- mountPath: /mnt/data
        #  name: cms-store-user

